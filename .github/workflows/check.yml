name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every <script> block
        run: |
          cat > /tmp/check-scripts.js <<'JS'
          const fs = require('fs'), os = require('os'), path = require('path');
          const { spawnSync } = require('child_process');
          let failed = 0;
          for (const file of process.argv.slice(2)) {
            const src = fs.readFileSync(file, 'utf8');
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, n = 0;
            while ((m = re.exec(src))) {
              n++;
              if (/\bsrc\s*=/i.test(m[1])) continue;               // external script, nothing to check
              const tmp = path.join(os.tmpdir(), `${path.basename(file)}.${n}.js`);
              fs.writeFileSync(tmp, m[2]);
              const r = spawnSync(process.execPath, ['--check', tmp], { encoding: 'utf8' });
              const line = src.slice(0, m.index).split('\n').length;
              if (r.status === 0) console.log(`ok    ${file} <script> #${n} (line ${line})`);
              else { failed++; console.log(`FAIL  ${file} <script> #${n} (line ${line})\n${r.stderr}`); }
            }
            if (n === 0) console.log(`note  ${file}: no <script> blocks`);
          }
          process.exit(failed ? 1 : 0);
          JS
          node /tmp/check-scripts.js index_opensource.html door_opensource.html

      - name: Placeholders (YOUR_) must not ship in a tag
        run: |
          if grep -n 'YOUR_' index_opensource.html door_opensource.html; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::YOUR_ placeholders found in a tagged release"
              exit 1
            else
              echo "::warning::YOUR_ placeholders present (expected on main, must be filled before tagging)"
            fi
          else
            echo "no YOUR_ placeholders"
          fi
